[package]
name = "capa-motion-studio"
version = "0.8.0"
description = "Desktop foundation for Roblox animation workflows"
authors = ["Capa"]
edition = "2021"

[lib]
name = "capa_motion_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
